<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <title>O Dinheiro Virou Digital</title>
    <script>
        AFRAME.registerComponent('play-on-marker', {
        schema: { video: { type: 'selector' } },
        init: function () {
            const v = this.data.video;
            this.el.addEventListener('markerFound', () => v.play());
            this.el.addEventListener('markerLost', () => v.pause());
        }
        });

        window.addEventListener('load', () => {
        const btn = document.getElementById('somBtn');
        btn.addEventListener('click', () => {
        const videos = document.querySelectorAll('video');
        const ligarSom = videos[0].muted; // se estava mudo, vai ligar
        videos.forEach(v => { v.muted = !ligarSom; });
        btn.textContent = ligarSom ? '🔊 Desativar som' : '🔇 Ativar som';
        });
        });
    </script>
    <style>
        .a-enter-vr, .a-enter-ar, .a-orientation-modal { display: none !important; }
    </style>
</head>
<body style="margin:0; overflow:hidden">
    <button id="somBtn" 
    style="position:fixed; 
    bottom:10px; 
    right:10px; 
    z-index:999; 
    padding:12px 16px; 
    font-size:16px; 
    border:none; 
    border-radius:8px;">
        🔇 Ativar som
    </button>
    <a-scene embedded arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 4x4_BCH_13_9_3;">
        <!-- Assets -->
        <a-assets>

            <!-- Video -->
            <video id="videscambo" src="assets/vid/escambo.mp4" preload="auto" loop muted playsinline></video>

            <video id="videletronico" src="assets/vid/eletronico.mp4" preload="auto" loop muted playsinline></video>
            <video id="viddigital" src="assets/vid/digital.mp4" preload="auto" loop muted playsinline></video>

            <img id="imgcunhagem" src="assets/img/cunhagem.png">

            <img id="imgeletronico" src="assets/img/eletronico.png">
            <img id="imgdigital" src="assets/img/digital.png">
            <!-- Texto -->

            <img id="txtmercadoria" src="assets/txt/w/mercadoria.png">
            <img id="txtmetalismo" src="assets/txt/w/metalismo.png">
            <img id="txtcunhagem" src="assets/txt/w/cunhagem.png">
            <img id="txtlastro" src="assets/txt/w/lastro.png">
